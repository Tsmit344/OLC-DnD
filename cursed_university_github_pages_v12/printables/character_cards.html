<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Roll of Destiny — Printable Character Cards</title><style>
@page{size:letter;margin:.52in}*{box-sizing:border-box}body{font:12px/1.4 Georgia,serif;color:#251e1b;background:#ebe8df;margin:0}.actions{text-align:center;padding:15px}.actions button{background:#302941;color:white;border:0;border-radius:6px;padding:11px 20px;cursor:pointer}.sheet{width:7.45in;margin:0 auto}.card{position:relative;height:3.05in;background:#f9f2e2;border:5px double #927449;margin-bottom:.16in;padding:13px 18px;break-inside:avoid;overflow:hidden}.card:nth-child(3n){break-after:page}.topline{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #b2976b;padding-bottom:8px;margin-bottom:10px}.number{border:2px solid #927449;width:45px;height:45px;display:grid;place-items:center;font-size:25px;font-weight:800}.eyebrow{font:bold 10px Arial;letter-spacing:2px;color:#715333}.name{font-size:23px;margin:0}.major{font:bold 11px Arial;color:#67553f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 17px}.label{font:bold 9px Arial;text-transform:uppercase;letter-spacing:.9px;color:#715333}.value{font:12px/1.33 Georgia;margin-top:2px}.intro{margin:8px 0;font-size:12px}.foot{position:absolute;bottom:8px;left:18px;right:18px;border-top:1px solid #baab91;padding-top:6px;display:flex;justify-content:space-between;font:italic 10px Georgia;color:#655945}@media print{body{background:white}.actions{display:none}.sheet{width:auto}.card{height:3.05in;margin-bottom:.12in}}
</style><script src="../assets/data.js" defer></script><script defer>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('cards').innerHTML=window.CURSED_DATA.characters.map(c=>`<article class="card"><div class="topline"><div><div class="eyebrow">THE ROLL OF DESTINY · ${c.tag.toUpperCase()}</div><h2 class="name">${c.name}</h2><div class="major">${c.major}</div></div><div class="number">${c.die}</div></div><p class="intro">${c.intro}</p><div class="grid"><div><div class="label">Strength</div><div class="value">${c.strengths}</div></div><div><div class="label">Obstacle</div><div class="value">${c.barrier}</div></div><div><div class="label">Attitude toward AI</div><div class="value">${c.ai}</div></div><div><div class="label">Gen-ed experience</div><div class="value">Likes ${c.likes.toLowerCase()}; avoids ${c.dislikes.toLowerCase()}.</div></div></div><div class="foot"><span>Years 1–2: Foundation Courses</span><span>Years 3–4: ${c.major}</span></div></article>`).join('');});</script></head><body><div class="actions"><h1>The Roll of Destiny</h1><p>Six printable character cards — cut and place one at each table following a d6 roll.</p><button onclick="window.print()">Print six cards</button></div><main id="cards" class="sheet"></main></body></html>
